<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>قائمة مراكز التعليم</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <div class="eyebrow">دليل مراكز التعليم</div>
      <h1>ابحث عن أقرب مركز تعليم مناسب لطفلك</h1>
      <p>اختر المحافظة والمدينة، أو اضغط على زر أقرب مركز لاستخدام موقعك الحالي. لا يتم حفظ موقعك أو إرساله لأي جهة.</p>
    </div>
  </header>

  <main>
    <section class="quick-actions" aria-label="إجراءات سريعة">
      <button id="closestBtn" class="primary-btn">اعرض أقرب مركز لموقعي</button>
      <button id="pdfBtn" class="secondary-btn">تحميل القائمة PDF</button>
      <button id="clearBtn" class="secondary-btn">مسح الفلاتر</button>
    </section>

    <section class="panel status-panel">
      <div id="statusText">جاري تحميل قائمة المراكز...</div>
    </section>

    <section class="panel filters" aria-label="فلاتر البحث">
      <label>
        المحافظة
        <select id="governorateFilter">
          <option value="">كل المحافظات</option>
        </select>
      </label>
      <label>
        المدينة / المنطقة
        <select id="cityFilter">
          <option value="">كل المدن / المناطق</option>
        </select>
      </label>
      <label>
        الصف الدراسي
        <select id="gradeFilter">
          <option value="">كل الصفوف</option>
        </select>
      </label>
      <label class="search-label">
        بحث بالاسم أو العنوان
        <input id="searchBox" type="search" placeholder="مثال: النصيرات، الأمل، التفاح" />
      </label>
    </section>

    <section class="list-header">
      <h2>المراكز المتاحة</h2>
      <span id="countText"></span>
    </section>

    <section id="results" class="results"></section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <div>
          <h3 class="lc-name"></h3>
          <p class="lc-meta"></p>
        </div>
        <span class="distance"></span>
      </div>
      <p class="address"></p>
      <p class="grades"></p>
      <p class="students"></p>
      <div class="card-actions">
        <a class="directions" target="_blank" rel="noopener">الاتجاهات عبر Google Maps</a>
      </div>
    </article>
  </template>

  <section id="printArea" class="print-area" aria-hidden="true"></section>

  <script src="app.js"></script>
</body>
</html>
