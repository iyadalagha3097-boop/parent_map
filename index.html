<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دليل أقرب مراكز التعلم</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQAvXw09kG70I6GC3mTZ+RlNRIJ8Cfw=" crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <div class="eyebrow">دليل مراكز التعلم</div>
      <h1>ابحث عن أقرب مركز تعلم</h1>
      <p>اسمح باستخدام موقعك لعرض أقرب المراكز. سيتم استخدام موقعك على هاتفك فقط ولن يتم حفظه.</p>
    </div>
    <button id="locateBtn" class="primary-btn">استخدم موقعي الحالي</button>
  </header>

  <main>
    <section class="panel status-panel">
      <div id="statusText">اضغط على “استخدم موقعي الحالي” للبدء.</div>
    </section>

    <section class="panel filters">
      <label>
        الصف
        <select id="gradeFilter">
          <option value="">جميع الصفوف</option>
        </select>
      </label>
      <label>
        المديرية
        <select id="directorateFilter">
          <option value="">جميع المديريات</option>
        </select>
      </label>
      <label>
        بحث
        <input id="searchBox" type="search" placeholder="اسم المركز أو العنوان" />
      </label>
    </section>

    <section class="map-wrap">
      <div id="map"></div>
    </section>

    <section class="list-header">
      <h2>أقرب المراكز</h2>
      <span id="countText"></span>
    </section>
    <section id="results" class="results"></section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <div>
          <h3 class="lc-name"></h3>
          <p class="lc-meta"></p>
        </div>
        <span class="distance"></span>
      </div>
      <p class="address"></p>
      <p class="grades"></p>
      <div class="card-actions">
        <a class="directions" target="_blank" rel="noopener">الاتجاهات</a>
      </div>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
